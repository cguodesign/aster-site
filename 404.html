<!doctype html>

<head>

<!-- Served for any missing path, at any depth, so every link here is relative to this <base>: the

<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root {
  --canvas: #f2eff8; --ink: #302d4d; --ink-soft: #514b6c; --ink-muted: #625b7c;
  --action: #62518c; --action-deep: #4f3f77; --on-action: #fcfaff;
  --serif: 'Source Serif 4', 'Noto Serif CJK SC', 'Songti SC', STSong, serif;
  --sans: 'Plus Jakarta Sans', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  --mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; color: var(--ink); font-family: var(--sans); line-height: 1.5; -webkit-font-smoothing: antialiased;
  background: var(--canvas) url('assets/hero-airy.webp') 50% 100% / cover no-repeat; }
:focus-visible { outline: 2px solid var(--action); outline-offset: 3px; }
header, main { width: 100%; max-width: 1360px; margin: 0 auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
@media (min-width: 900px) { header, main { padding-inline: 40px; } }
.logo { display: inline-flex; align-items: center; min-height: 44px; margin-top: 12px; font-family: var(--serif); font-weight: 300; font-size: 28px; color: var(--ink); text-decoration: none; }
main { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 48px; padding-block: 48px 30vh; }
.code { margin: 0; font-family: var(--mono); font-size: 12px; letter-spacing: .2em; color: var(--ink-muted); }
section { display: flex; flex-direction: column; gap: 12px; max-width: 34em; }
h1 { margin: 0; font-family: var(--serif); font-weight: 300; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.15; letter-spacing: -0.01em; }
p { margin: 0; color: var(--ink-soft); }
a.pill { align-self: flex-start; display: inline-flex; align-items: center; min-height: 44px; margin-top: 8px; padding: 0 22px; border-radius: 999px; background: var(--action); color: var(--on-action); font-size: 14px; font-weight: 600; text-decoration: none; transition: background-color 200ms; }
a.pill:hover { background: var(--action-deep); }
section[lang] p a { color: var(--ink); }
</style>
</head>
<body>
<header><a class="logo" href="./" aria-label="Aster home">Aster</a></header>
<main>
  <p class="code">404</p>
  <section>
    <h1>This page isn’t here.</h1>
    <p>The link may be wrong, or the page has moved.</p>
    <a class="pill" href="./">Back to the Aster home page</a>
  </section>
  <section lang="zh-CN">
    <p>这一页不在这里。<a href="zh/">回到中文首页</a></p>
  </section>
</main>
</body>
</html>
